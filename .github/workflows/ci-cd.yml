name: CI-CD-Pipeline

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
          docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/hello-xyz:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/hello-xyz:${{ github.sha }} \
                     ${{ secrets.DOCKER_USERNAME }}/hello-xyz:latest

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/hello-xyz:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/hello-xyz:latest

      - name: Deploy to Minikube
        run: |
          kubectl set image deployment/hello-xyz-deployment \
            hello-xyz-container=${{ secrets.DOCKER_USERNAME }}/hello-xyz:${{ github.sha }}
          kubectl rollout status deployment/hello-xyz-deployment
