apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-xyz-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-xyz
  template:
    metadata:
      labels:
        app: hello-xyz
    spec:
      containers:
        - name: hello-xyz-container
          image: your-dockerhub-username/hello-xyz:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: hello-xyz-service
spec:
  type: NodePort
  selector:
    app: hello-xyz
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30007